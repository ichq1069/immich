name: immich

services:
  # ========== R2 存储挂载（docker-compose 集成） ==========
  rclone:
    image: rclone/rclone:1.70
    container_name: immich_rclone
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse
    environment:
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
    volumes:
      - rclone-cache:/cache
      - /root/immich-app/r2-immich-photo:/data:shared
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /root/.config/rclone
        cat > /root/.config/rclone/rclone.conf << RCLONE_EOF
        [r2]
        type = s3
        provider = Cloudflare
        access_key_id = $R2_ACCESS_KEY_ID
        secret_access_key = $R2_SECRET_ACCESS_KEY
        endpoint = $R2_ENDPOINT
        acl = private
        RCLONE_EOF
        exec rclone mount r2:$R2_BUCKET_NAME /data \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode writes \
          --vfs-cache-max-age 1h \
          --vfs-cache-max-size 10G \
          --cache-dir /cache \
          --dir-cache-time 5m \
          --no-checksum \
          --log-level INFO
    restart: always
    healthcheck:
      test: ["CMD", "rclone", "about", "r2:$R2_BUCKET_NAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ========== Immich 核心服务 ==========
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu
    volumes:
      - /root/immich-app/r2-immich-photo:/data:rw
      - /etc/localtime:/etc/localtime:ro
      # 自定义外部图库
      - /root/immich-app/library:/mnt/library:ro
      - /root/immich-app/pikpak:/mnt/pikpak:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      rclone:
        condition: service_healthy
      redis:
        condition: service_started
      database:
        condition: service_started
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # extends:
    #   file: hwaccel.ml.yml
    #   service: cpu
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # 数据库必须放本地，不能用 R2
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
  rclone-cache: